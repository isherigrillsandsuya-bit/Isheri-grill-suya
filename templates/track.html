<!DOCTYPE html>
<html>
<head>
    <title>Live Order Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">
<div class="container text-center">
    <h2>🚚 Order Tracking #{{ order.id }}</h2>
    <div class="card p-4 my-3 shadow-sm">
        <h4>Status: <span class="badge bg-warning text-dark">{{ order.status }}</span></h4>
        <div class="progress my-3" style="height: 25px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 50%;">Preparing 🍳</div>
        </div>
        <p>Estimated Time: <strong>25 - 35 mins</strong></p>
        <p class="text-muted">Delivering to: {{ order.delivery_address }}</p>
    </div>
    <a href="/" class="btn btn-secondary">Back to Home</a>
</div>
</body>
</html>
