{% extends 'base/base.html' %}
{% block content %}
<div class="mt-10 bg-stone-800 border border-stone-700 rounded-3xl p-6 shadow-2xl">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-black text-white">Welcome Back! 🔥</h1>
        <p class="text-sm text-stone-400 mt-1">Sign in to complete your order</p>
    </div>
    
    {% if messages %}
    <div class="bg-red-500/20 border border-red-500 text-red-400 text-xs p-3 rounded-xl mb-4">
        {% for message in messages %}{{ message }}{% endfor %}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="text-xs font-bold text-stone-400 uppercase tracking-wider block mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full bg-stone-900 border border-stone-700 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:border-amber-500 transition">
        </div>
        <div>
            <label class="text-xs font-bold text-stone-400 uppercase tracking-wider block mb-1">Password</label>
            <input type="password" name="password" required class="w-full bg-stone-900 border border-stone-700 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:border-amber-500 transition">
        </div>
        <div class="flex justify-end">
            <a href="#" class="text-xs text-amber-500 hover:underline">Forgot Password?</a>
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-stone-900 font-bold py-3.5 rounded-xl shadow-lg mt-4 transition">Sign In</button>
    </form>
    
    <p class="text-center text-xs text-stone-400 mt-6">
        Don't have an account? <a href="{% url 'users:register' %}" class="text-amber-500 font-bold hover:underline">Sign Up</a>
    </p>
</div>
{% endblock content %}
