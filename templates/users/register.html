{% extends 'base/base.html' %}
{% block content %}
<div class="mt-4 bg-stone-800 border border-stone-700 rounded-3xl p-6 shadow-2xl">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-white">Create Account 🔥</h1>
        <p class="text-sm text-stone-400 mt-1">Join ISHERI GRILLS for fast checkouts</p>
    </div>
    
    {% if messages %}
    <div class="bg-red-500/20 border border-red-500 text-red-400 text-xs p-3 rounded-xl mb-4">
        {% for message in messages %}{{ message }}{% endfor %}
    </div>
    {% endif %}

    <form method="POST" class="space-y-3">
        {% csrf_token %}
        <div>
            <label class="text-[10px] font-bold text-stone-400 uppercase tracking-wider block mb-1">Full Name</label>
            <input type="text" name="full_name" required class="w-full bg-stone-900 border border-stone-700 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:border-amber-500">
        </div>
        <div>
            <label class="text-[10px] font-bold text-stone-400 uppercase tracking-wider block mb-1">Phone Number (For Delivery Riders)</label>
            <input type="tel" name="phone" required class="w-full bg-stone-900 border border-stone-700 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:border-amber-500">
        </div>
        <div>
            <label class="text-[10px] font-bold text-stone-400 uppercase tracking-wider block mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full bg-stone-900 border border-stone-700 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:border-amber-500">
        </div>
        <div>
            <label class="text-[10px] font-bold text-stone-400 uppercase tracking-wider block mb-1">Password</label>
            <input type="password" name="password" required class="w-full bg-stone-900 border border-stone-700 rounded-xl px-4 py-3 text-stone-100 focus:outline-none focus:border-amber-500">
        </div>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-2 transition">Send Verification OTP</button>
    </form>
    
    <p class="text-center text-xs text-stone-400 mt-5">
        Already have an account? <a href="{% url 'users:login' %}" class="text-amber-500 font-bold hover:underline">Sign In</a>
    </p>
</div>
{% endblock content %}
