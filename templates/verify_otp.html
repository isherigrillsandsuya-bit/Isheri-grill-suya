<!DOCTYPE html>
<html>
<head>
    <title>Verify Email OTP | Isheri Grills & Suya</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container" style="max-width: 400px;">
    <div class="card p-4 shadow-sm text-center">
        <h3>Enter Email OTP ✉️</h3>
        <p class="text-muted">We sent a 6-digit code to <strong>{{ email }}</strong></p>
        {% if messages %}
            {% for m in messages %}<div class="alert alert-info">{{ m }}</div>{% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="otp" maxlength="6" class="form-control text-center fs-3 fw-bold" placeholder="123456" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Verify & Continue</button>
        </form>
    </div>
</div>
</body>
</html>
