{% extends 'base/base.html' %}
{% block content %}
<div class="space-y-6 pb-4">
    <div class="bg-stone-800 border border-stone-700 rounded-3xl p-5 flex items-center justify-between shadow-xl">
        <div>
            <p class="text-amber-500 text-[10px] font-black uppercase tracking-widest mb-1">Category</p>
            <h1 class="text-2xl font-black text-white tracking-tight uppercase">{{ category.name }}</h1>
        </div>
        <a href="{% url 'shop:home' %}" class="bg-stone-700 text-stone-300 px-3.5 py-2 rounded-xl text-xs font-bold">&larr; Back</a>
    </div>

    <div class="grid grid-cols-2 gap-3.5">
        {% for item in items %}
        <div class="bg-stone-800/80 border border-stone-700 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between">
            <a href="{% url 'shop:product' item.id %}" class="w-full h-32 bg-stone-900 relative block">
                <img src="https://picsum.photos/400/300?random={{ item.id }}" class="w-full h-full object-cover opacity-80" alt="{{ item.name }}">
                <span class="absolute top-2 right-2 text-[10px] font-bold bg-stone-100 text-stone-900 px-2 py-1 rounded-md flex items-center gap-1 shadow-lg">⏱ {{ item.prep_time }}</span>
            </a>
            <div class="p-3.5">
                <div class="mb-2"><a href="{% url 'shop:product' item.id %}"><h3 class="font-bold text-sm text-stone-100 leading-tight">{{ item.name }}</h3></a></div>
                <div class="mt-2 pt-2 border-t border-stone-700/60 flex items-center justify-between">
                    <span class="font-black text-amber-500 text-sm">₦{{ item.price|floatformat:0 }}</span>
                    <button hx-post="{% url 'shop:add_to_cart' item.id %}" class="bg-red-600 active:scale-95 text-white w-7 h-7 rounded-xl flex items-center justify-center font-black text-sm shadow-md transition">+</button>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-span-2 text-center py-10"><p class="text-stone-500 text-sm">No items currently available in this category.</p></div>
        {% endfor %}
    </div>
</div>
{% endblock content %}
