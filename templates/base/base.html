<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISHERI GRILLS & SUYA</title>
    <link rel="manifest" href="/static/pwa/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/pwa/sw.js');
            });
        }
    </script>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen font-sans flex flex-col items-center">
    <div class="w-full max-w-md min-h-screen bg-stone-900 border-x border-stone-800 flex flex-col justify-between shadow-2xl relative">
        
        <header class="bg-stone-900/90 backdrop-blur-md border-b border-stone-800 p-4 sticky top-0 z-40 flex justify-between items-center">
            <a href="{% url 'shop:home' %}" class="flex items-center gap-2">
                <span class="text-2xl">🔥</span>
                <span class="font-black text-amber-500 tracking-wider text-sm">ISHERI <span class="text-white">GRILLS</span></span>
            </a>
            <div class="flex items-center gap-3">
                {% if user.is_authenticated %}
                <a href="{% url 'shop:profile' %}" class="text-xs font-bold text-amber-500 bg-amber-500/10 px-2.5 py-1 rounded-full border border-amber-500/20">👤 {{ user.username|slice:":8" }}</a>
                {% else %}
                <a href="{% url 'users:login' %}" class="text-xs font-bold text-stone-300 hover:text-white">Login</a>
                {% endif %}
                <button onclick="document.getElementById('cart-wardrobe').classList.toggle('translate-x-full')" class="relative p-2 text-stone-300 hover:text-white">
                    🛒
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded-full border border-stone-900">
                        {{ cart_count|default:0 }}
                    </span>
                </button>
            </div>
        </header>

        <main class="flex-1 p-4 overflow-y-auto">
            {% block content %}{% endblock content %}
        </main>

        <nav class="bg-stone-900 border-t border-stone-800 p-3 sticky bottom-0 z-40 flex justify-around items-center text-xs">
            <a href="{% url 'shop:home' %}" class="flex flex-col items-center text-stone-400 hover:text-amber-500">
                <span>🏠</span>
                <span class="text-[10px] font-bold mt-0.5">Home</span>
            </a>
            <a href="{% url 'shop:menu' %}" class="flex flex-col items-center text-stone-400 hover:text-amber-500">
                <span>🍢</span>
                <span class="text-[10px] font-bold mt-0.5">Menu</span>
            </a>
            <a href="{% url 'shop:profile' %}" class="flex flex-col items-center text-stone-400 hover:text-amber-500">
                <span>👛</span>
                <span class="text-[10px] font-bold mt-0.5">Wallet</span>
            </a>
        </nav>

        <div id="cart-wardrobe" class="fixed inset-y-0 right-0 w-80 bg-stone-900 border-l border-stone-800 z-50 transform translate-x-full transition-transform duration-300 shadow-2xl flex flex-col justify-between">
            <div id="cart-wardrobe-inner" class="p-4 space-y-4 overflow-y-auto">
                {% include 'shop/partials/cart_wardrobe_inner.html' %}
            </div>
        </div>

    </div>
</body>
</html>
