{% extends 'base/base.html' %}
{% block content %}
<div class="mt-10 bg-stone-800 border border-stone-700 rounded-3xl p-6 shadow-2xl text-center">
    <span class="text-4xl block mb-3">✉️</span>
    <h1 class="text-xl font-black text-white">Check Your Email</h1>
    <p class="text-xs text-stone-400 mt-2 mb-6">We've sent a 6-digit verification code to<br><span class="text-amber-500 font-bold">{{ email }}</span></p>
    
    {% if messages %}
    <div class="bg-red-500/20 border border-red-500 text-red-400 text-xs p-3 rounded-xl mb-4">
        {% for message in messages %}{{ message }}{% endfor %}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <input type="text" name="code" placeholder="• • • • • •" required maxlength="6" class="w-full bg-stone-900 border border-stone-700 rounded-xl px-4 py-4 text-center text-2xl tracking-[1em] text-stone-100 focus:outline-none focus:border-amber-500 font-black">
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-stone-900 font-bold py-3.5 rounded-xl shadow-lg transition">Verify & Continue</button>
    </form>
</div>
{% endblock content %}
