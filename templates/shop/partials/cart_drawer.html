<div x-data="{ open: true }" 
     x-show="open" 
     class="fixed inset-0 z-[100] flex flex-col justify-end">
    
    <div x-show="open" 
         x-transition.opacity.duration.300ms
         @click="open = false; setTimeout(() => document.getElementById('cart-drawer-container').innerHTML='', 300)"
         class="absolute inset-0 bg-black/70 backdrop-blur-sm cursor-pointer"></div>

    <div x-show="open" 
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="translate-y-full"
         x-transition:enter-end="translate-y-0"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="translate-y-0"
         x-transition:leave-end="translate-y-full"
         class="relative w-full max-w-2xl mx-auto bg-[#1A1A1A] rounded-t-3xl shadow-2xl border-t border-gray-800 flex flex-col max-h-[85vh]">
        
        <div class="w-full flex justify-center pt-4 pb-2" 
             @click="open = false; setTimeout(() => document.getElementById('cart-drawer-container').innerHTML='', 300)">
            <div class="w-12 h-1.5 bg-gray-700 rounded-full cursor-pointer"></div>
        </div>

        <div class="px-5 pb-5 overflow-y-auto hide-scrollbar">
            <div class="flex justify-between items-center mb-6 mt-2">
                <h2 class="text-2xl font-bold text-white tracking-tight">Your Order</h2>
                <span class="bg-isheri-red text-white text-xs font-bold px-2 py-1 rounded-full">{{ total_items }} items</span>
            </div>

            <div class="space-y-4 mb-24">
                {% for item in cart_items %}
                <div class="flex items-center bg-[#242424] p-3 rounded-2xl border border-gray-800">
                    <div class="w-16 h-16 shrink-0 bg-gray-900 rounded-xl overflow-hidden">
                        <img src="{{ item.image }}" alt="{{ item.name }}" class="w-full h-full object-cover">
                    </div>
                    
                    <div class="ml-4 flex-1">
                        <h3 class="text-sm font-bold text-gray-100">{{ item.name }}</h3>
                        <div class="text-isheri-orange font-bold text-sm mt-1">₦{{ item.price }}</div>
                    </div>
                    
                    <div class="flex items-center space-x-3 bg-[#1A1A1A] rounded-lg p-1 border border-gray-700">
                        <button class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-white">-</button>
                        <span class="text-white font-bold text-sm">{{ item.quantity }}</span>
                        <button hx-post="{% url 'shop:add_to_cart' item.id %}" 
                                hx-target="#cart-drawer-container"
                                class="w-8 h-8 flex items-center justify-center text-isheri-red hover:text-red-400 font-bold">+</button>
                    </div>
                </div>
                {% empty %}
                <p class="text-gray-500 text-center py-8">Your cart is empty.</p>
                {% endfor %}
            </div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-[#1A1A1A] via-[#1A1A1A] to-transparent">
            <a href="{% url 'shop:checkout' %}" 
               class="flex items-center justify-between w-full bg-isheri-red hover:bg-red-700 text-white font-bold py-4 px-6 rounded-2xl shadow-[0_10px_25px_rgba(230,57,70,0.3)] transition-all active:scale-[0.98]">
                <span>Proceed to Checkout</span>
                <span class="bg-black/20 px-3 py-1 rounded-lg">₦{{ subtotal }}</span>
            </a>
        </div>
    </div>
</div>
