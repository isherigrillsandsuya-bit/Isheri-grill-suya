<div class="mt-4 space-y-4">
    {% if cart.items.all %}
        {% for cart_item in cart.items.all %}
        <div class="flex items-center justify-between border-b border-stone-700 pb-3">
            <div>
                <p class="font-medium text-white">{{ cart_item.item.name }}</p>
                <p class="text-sm text-stone-400">₦{{ cart_item.item.price|floatformat:2 }}</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="bg-amber-500/20 text-amber-400 px-3 py-1 rounded-full text-xs">Qty: {{ cart_item.quantity }}</span>
            </div>
        </div>
        {% endfor %}
        
        <div class="pt-4 space-y-2 text-sm text-stone-400">
            <div class="flex justify-between text-xs text-red-400">
                <span>Platform Security Charge</span>
                <span>+ ₦70.00</span>
            </div>
        </div>

        <a href="{% url 'shop:checkout' %}" class="block text-center w-full bg-amber-500 hover:bg-amber-600 text-stone-900 font-bold py-3.5 rounded-xl mt-6 shadow-lg shadow-amber-500/20 tracking-wide transition">Proceed to Checkout</a>
    {% else %}
        <div class="text-center py-8 text-stone-500">
            <span class="text-4xl mb-3 block">🛒</span>
            <p>Your grill is currently empty!</p>
        </div>
    {% endif %}
</div>
