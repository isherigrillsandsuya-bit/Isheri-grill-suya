<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Isheri Grills & Suya — Lagos suya, grills, and fast delivery made delicious.">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Isheri Grills & Suya{% endblock %}</title>

    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        isheri: {
                            red: '#E63946',
                            orange: '#FF8C00',
                            charcoal: '#111827',
                            light: '#F8FAFC',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="bg-isheri-charcoal text-white font-sans antialiased pb-24 min-h-screen overflow-x-hidden {% block body_class %}{% endblock %}" id="app-shell">

    <header class="site-header sticky top-0 z-50 border-b border-white/10 shadow-sm">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
            <a href="/" class="text-xl font-black tracking-tight text-white">
                ISHERI <span class="text-isheri-red">GRILLS</span>
            </a>
            <div class="hidden items-center gap-6 md:flex">
                <a href="{% url 'shop:menu' %}" class="page-link text-sm font-semibold text-stone-200 hover:text-white">Menu</a>
                <a href="{% url 'shop:checkout' %}" class="page-link text-sm font-semibold text-stone-200 hover:text-white">Checkout</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'users:logout' %}" class="page-link text-sm font-semibold text-isheri-orange hover:text-white">Logout</a>
                {% else %}
                    <a href="{% url 'users:login' %}" class="page-link text-sm font-semibold text-isheri-orange hover:text-white">Sign In</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="page-shell mx-auto w-full max-w-6xl px-4 py-8 sm:px-6">
        {% block content %}
        {% endblock content %}
    </main>

    <nav class="bottom-nav fixed inset-x-0 bottom-0 z-40 block border-t border-white/10 bg-slate-950/95 px-4 py-2 backdrop-blur sm:hidden">
        <div class="flex items-center justify-between gap-3">
            <a href="/" class="page-link inline-flex flex-1 flex-col items-center rounded-2xl bg-white/5 px-3 py-2 text-center text-xs font-semibold text-white transition hover:bg-white/10">
                Home
            </a>
            <a href="{% url 'shop:menu' %}" class="page-link inline-flex flex-1 flex-col items-center rounded-2xl bg-white/5 px-3 py-2 text-center text-xs font-semibold text-white transition hover:bg-white/10">
                Menu
            </a>
            <a href="{% url 'shop:checkout' %}" class="page-link inline-flex flex-1 flex-col items-center rounded-2xl bg-white/5 px-3 py-2 text-center text-xs font-semibold text-white transition hover:bg-white/10">
                Checkout
            </a>
        </div>
    </nav>

    <div id="cart-drawer-container"></div>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
