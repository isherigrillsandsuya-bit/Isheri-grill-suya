<!DOCTYPE html>
<html>
<head>
    <title>{{ item.name }} | Isheri Grills & Suya</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <a href="/" class="btn btn-secondary mb-3">← Back to Menu</a>
    <div class="card shadow-sm">
        {% if item.image %}
            <img src="{{ item.image.url }}" class="card-img-top" style="max-height: 300px; object-fit: cover;">
        {% else %}
            <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80" class="card-img-top" style="max-height: 300px; object-fit: cover;">
        {% endif %}
        <div class="card-body">
            <h3>{{ item.name }}</h3>
            <p class="text-muted">{{ item.description }}</p>
            <h4 class="text-danger fw-bold">₦{{ item.price }}</h4>
            
            <form action="{% url 'cart_add' item.id %}" method="post" class="mt-3">
                {% csrf_token %}
                <div class="mb-3">
                    <label>Quantity:</label>
                    <input type="number" name="quantity" value="1" min="1" class="form-control" style="width: 100px;">
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">🛒 Add to Cart</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
