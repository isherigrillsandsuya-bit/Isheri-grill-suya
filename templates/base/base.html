<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Isheri Grills & Suya{% endblock %}</title>
    
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        isheri: {
                            red: '#E63946',
                            orange: '#FF8C00',
                            charcoal: '#1A1A1A',
                            light: '#FAFAFA',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Hide scrollbar for clean mobile horizontal scrolling */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-isheri-charcoal text-white font-sans antialiased pb-24 h-screen overflow-y-auto" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <header class="sticky top-0 z-50 bg-isheri-charcoal border-b border-gray-800 shadow-md">
        <div class="flex justify-between items-center px-4 py-3 max-w-2xl mx-auto">
            <a href="/" class="text-xl font-bold tracking-tight text-white">
                ISHERI <span class="text-isheri-red">GRILLS</span>
            </a>
            
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <a href="#" class="text-sm font-semibold text-gray-300 hover:text-white">Profile</a>
                {% else %}
                    <a href="#" class="text-sm font-semibold text-isheri-orange">Sign In</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto w-full relative">
        {% block content %}
        {% endblock content %}
    </main>

    <div id="cart-drawer-container"></div>

    <script>
        // Ensure HTMX works smoothly with Django CSRF tokens
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>
</body>
</html>
